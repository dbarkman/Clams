# Clams — cla.ms URL shortener. HTTPS reverse proxy to uvicorn on 127.0.0.1:8012.
# Source of truth: Clams repo deploy/cla.ms.conf → /etc/httpd/conf.d/cla.ms.conf
<VirtualHost *:443>
    ServerName cla.ms

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cla.ms/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cla.ms/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /.well-known/ !
    ProxyPass        /  http://127.0.0.1:8012/
    ProxyPassReverse /  http://127.0.0.1:8012/

    ErrorLog  /var/log/httpd/clams_error.log
    CustomLog /var/log/httpd/clams_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName www.cla.ms
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/cla.ms/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cla.ms/privkey.pem
    RewriteEngine On
    RewriteRule ^ https://cla.ms%{REQUEST_URI} [R=permanent,L]
</VirtualHost>

<VirtualHost *:80>
    ServerName cla.ms
    ServerAlias www.cla.ms
    DocumentRoot /var/www/html/clams-acme
    <Directory /var/www/html/clams-acme>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/
    RewriteRule ^ https://cla.ms%{REQUEST_URI} [R=permanent,L]
</VirtualHost>
