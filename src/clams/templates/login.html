{% extends "base.html" %}
{% block title %}Sign in — Clams{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Welcome back 👋</h1>
  <p class="lead">Sign in to see and edit your Clams.</p>
  <div class="card">
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    {% include "_providers.html" %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div><label for="email">Email</label><input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="email" required></div>
      <div><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit">Sign in</button>
    </form>
    <p class="small muted center" style="margin:14px 0 0"><a href="/forgot">Forgot password?</a> · New here? <a href="/signup{% if next %}?next={{ quote(next) }}{% endif %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
