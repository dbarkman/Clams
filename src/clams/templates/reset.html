{% extends "base.html" %}
{% block title %}Choose a new password — Clams{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Choose a new password</h1>
  <form class="card stack" method="post" action="/reset/{{ token }}">
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div><label for="password">New password <span class="muted">(8+ characters)</span></label><input id="password" type="password" name="password" autocomplete="new-password" minlength="8" required></div>
    <button class="btn block" type="submit">Save password</button>
  </form>
</div>
{% endblock %}
