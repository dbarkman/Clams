[project]
name = "clams"
version = "0.1.0"
description = "cla.ms — a friendly URL shortener. Short links are Clams."
readme = "README.md"
authors = [{ name = "David Barkman" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "maxminddb==3.3.0",
    "pyjwt[crypto]==2.15.1",
    "pymysql==1.2.4",
    "python-multipart==0.0.34",
    "segno==1.6.6",
    "sqlalchemy==2.1.9",
    "uvicorn==0.54.0",
]

[project.scripts]
clams-admin = "clams.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
